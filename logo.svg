<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500&amp;family=Noto+Sans+JP:wght@300&amp;display=swap');
    </style>
  </defs>

  <!-- X Monogram -->
  <!-- Main strokes -->
